name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push to a PR cancels the
# older run so CI signal reflects the tip).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Individual jobs opt in to more as needed.
permissions:
  contents: read

jobs:
  lint:
    name: lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # go.mod declares `go 1.25` — that's the floor. Test on the latest
        # 1.25.x patch (updated by setup-go automatically).
        go: ['1.25.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: go build (static)
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: go test with race detector
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  build-artifact:
    name: build (static binary sanity)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build weftly
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags '-s -w' -o weftly ./cmd/weftly
          file weftly
          ./weftly version
      - name: validate flagship example
        run: ./weftly validate workflows/petclinic-onboarding.yml
      - uses: actions/upload-artifact@v7
        with:
          name: weftly-linux-amd64
          path: weftly
          if-no-files-found: error

  release-archive:
    name: release archive (goreleaser snapshot)
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Every push that could affect release plumbing gets a full
    # snapshot build, extracted, and smoke-tested. This exists because
    # a silent `no files matched glob=workflows/**/*` in goreleaser
    # shipped an empty tarball to users under a config that looked
    # correct — the regression only surfaced on `tar xzf`. Now CI
    # inspects the tarball and runs the shipped binary against the
    # shipped hello workflow so the same class of bug can't ship.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # goreleaser reads tags for version stamping
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish --skip=sign --skip=validate --skip=announce --skip=chocolatey --skip=nix --skip=ko --skip=sbom
      - name: archive contains workflows/ + examples/
        run: |
          set -euxo pipefail
          tarball=$(ls dist/weftly_*_linux_amd64.tar.gz | head -n1)
          contents=$(tar tzf "$tarball")
          echo "$contents"
          for want in weftly workflows/hello.yml workflows/petclinic-onboarding.yml examples/schedules.example.yaml examples/weftly.example.yaml README.md LICENSE; do
            if ! echo "$contents" | grep -qx "$want"; then
              echo "::error::release tarball is missing $want"
              exit 1
            fi
          done
      - name: shipped binary runs the shipped hello workflow
        run: |
          set -euxo pipefail
          tarball=$(ls dist/weftly_*_linux_amd64.tar.gz | head -n1)
          extract=$(mktemp -d)
          tar xzf "$tarball" -C "$extract"
          cd "$extract"
          ./weftly version
          ./weftly validate workflows/hello.yml
          ./weftly run workflows/hello.yml --no-color --input name=ci
